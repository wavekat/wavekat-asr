name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: [self-hosted, wavekat-ci]
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        # ALSA headers for the mic examples; cmake + libclang to build
        # llama.cpp for the `r2t2` feature.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev cmake clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --features sherpa-onnx 2>&1 | tee test-output.txt
      - run: cargo doc --no-deps -p wavekat-asr --all-features
      - name: Job summary
        if: always()
        run: |
          echo "## Check" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rustc --version >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-output.txt ]; then
            echo "### Test Results" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E '^test result:|^running' test-output.txt >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  features:
    runs-on: [self-hosted, wavekat-ci]
    strategy:
      matrix:
        features:
          - ""
          - "sherpa-onnx"
          - "r2t2"
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        # ALSA headers for the mic examples; cmake + libclang to build
        # llama.cpp for the `r2t2` feature.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev cmake clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test -p wavekat-asr --no-default-features --features "${{ matrix.features }}"
