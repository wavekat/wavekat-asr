[package]
name = "wavekat-asr"
description = "Unified streaming ASR with multiple backends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/wavekat/wavekat-asr"
homepage = "https://github.com/wavekat/wavekat-asr"
documentation = "https://docs.rs/wavekat-asr"
readme = "../../README.md"
keywords = ["asr", "speech-to-text", "voice", "telephony", "wavekat"]
categories = ["multimedia::audio"]
exclude = ["CHANGELOG.md"]

[features]
default = []
# Generic HuggingFace download helper with byte-level progress
# reporting. Used by any backend whose model files live on HF Hub;
# enabled transitively by such backends so callers usually don't
# turn it on directly.
download = ["dep:hf-hub"]
# Local streaming backend wrapping sherpa-onnx around a streaming
# Zipformer transducer. Auto-downloads the default bilingual EN+ZH
# model from HuggingFace on first use.
sherpa-onnx = ["dep:sherpa-onnx", "download"]

[dependencies]
wavekat-core = "0.0.11"
thiserror = "2"
tracing = "0.1"

sherpa-onnx = { version = "1.13", optional = true }
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "native-tls"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
wavekat-core = { version = "0.0.11", features = ["wav", "resample"] }
# Dev-deps override main's wavekat-core to add `wav`/`resample` features
# for the example binaries; the library itself does not need them.
cpal = "0.17"
ctrlc = "3.5"

[[example]]
name = "transcribe_wav"
required-features = ["sherpa-onnx"]

[[example]]
name = "transcribe_mic"
required-features = ["sherpa-onnx"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
